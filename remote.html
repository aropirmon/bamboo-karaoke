<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bamboo DJ — Pro Command Center</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #ff003c; --gold: #c9a468; --bg: #050505; --card: #121513; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 5px; background: var(--bg); color: #fff; font-family: 'Jost', sans-serif; height: 100vh; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100%; gap: 5px; }

        /* WAVEFORMS FIX - VIRTUAL DJ STYLE */
        .wave-section { height: 100px; background: #000; border: 1px solid #333; border-radius: 10px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding: 4px 0; }
        .wave-lane { position: relative; flex: 1; overflow: hidden; background: rgba(255,255,255,0.02); }
        .grid-container { position: absolute; inset: 0; pointer-events: none; }
        .moving-grid { 
            position: absolute; top: 0; left: 50%; height: 100%; width: 50000px; 
            background-image: linear-gradient(90deg, var(--gold) 1px, transparent 1px); 
            background-size: 80px 100%; /* Lebar antar beat */
            transform: translateX(0);
            will-change: transform;
        }
        .needle { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 20; box-shadow: 0 0 10px #fff; }
        .lane-label { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 9px; color: var(--gold); opacity: 0.5; font-weight: bold; z-index: 15; }

        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #111; border-radius: 10px; border: 1px solid #222; }
        .logo { font-family: 'Alex Brush'; font-size: 26px; color: #fff; text-shadow: 0 0 10px var(--neon); margin:0; }
        .mode-btn { background: var(--gold); color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 10px; }
        .mode-btn.sw { background: #444; color: #fff; }
        .led { width: 8px; height: 8px; border-radius: 50%; background: #ff003c; display: inline-block; margin-left: 5px; }
        .led.active { background: #4caf50; box-shadow: 0 0 10px #4caf50; }

        /* MAIN DASHBOARD */
        .main-engine { display: grid; grid-template-columns: 1fr 320px 1fr; gap: 8px; flex: 1; min-height: 0; }
        @media (max-width: 850px) {
            .main-engine { display: flex; flex-direction: column; overflow-y: auto; }
            .mixer { width: 100% !important; min-height: 520px; order: 2; margin: 10px 0; }
            .deck { min-height: 320px; order: 1; }
            .deck:last-child { order: 3; }
        }

        .deck { background: var(--card); border: 1px solid #222; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .bpm-num { font-size: 32px; font-weight: 800; color: var(--gold); }
        input { width: 100%; background: #000; border: 1px solid #333; color: var(--gold); padding: 12px; border-radius: 8px; font-size: 12px; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-play { background: #1a3a26; border: 1px solid #4caf50; color: #4caf50; }
        .btn-stop { background: #331111; border: 1px solid #ff003c; color: #ff003c; }

        /* MIXER */
        .mixer { background: #080808; border: 1px solid var(--neon); border-radius: 15px; display: grid; grid-template-columns: 60px 1fr 60px; padding: 10px; position: relative; }
        .shield { position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; border-radius: 15px; display: none; align-items: center; justify-content: center; text-align: center; color: var(--gold); font-size: 12px; font-weight: bold; }
        .hw-locked .shield { display: flex; }

        .fader-v-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .fader-v { appearance: none; width: 120px; height: 5px; background: #222; transform: rotate(-90deg); margin: 60px -30px; outline: none; }
        .fader-v::-webkit-slider-thumb { appearance: none; width: 25px; height: 15px; background: var(--gold); border-radius: 2px; }
        
        .eq-stack { display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 5px 0; }
        .eq-knob { width: 90px; accent-color: var(--gold); height: 4px; margin: 10px 0; }
        .xfade { width: 90%; height: 40px; accent-color: var(--neon); margin-top: 15px; }
        .label { font-size: 8px; color: var(--gold); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="wrapper hw-locked" id="ui-container">
    <div class="wave-section">
        <div class="needle"></div>
        <div class="wave-lane">
            <span class="lane-label">DECK A</span>
            <div id="gridA" class="moving-grid"></div>
        </div>
        <div class="wave-lane">
            <span class="lane-label">DECK B</span>
            <div id="gridB" class="moving-grid"></div>
        </div>
    </div>

    <header>
        <p class="logo">Bamboo Terrace</p>
        <div class="mode-box">
            <button id="mBtn" class="mode-btn" onclick="toggleM()">MODE: PIONEER RX3</button>
            <div style="font-size:9px; display:flex; gap:10px; margin-left:10px;">
                TV <div id="tvL" class="led"></div> MIDI <div id="miL" class="led"></div>
            </div>
        </div>
    </header>

    <div class="main-engine">
        <div class="deck">
            <div style="display:flex; justify-content:space-between"><span class="label">DECK 1</span><div class="bpm-num" id="ui-bpmA">128.0</div></div>
            <input type="text" id="urlA" placeholder="YouTube Link A">
            <button class="btn" style="background:var(--gold)" onclick="loadV('A')">LOAD A</button>
            <div style="display:flex; gap:5px"><button class="btn btn-play" onclick="cmd('A','play')">▶ PLAY</button><button class="btn btn-stop" onclick="cmd('A','stop')">■ STOP</button></div>
            <button class="btn" style="background:#222; color:var(--gold); font-size:9px" onclick="syncV('A')">SYNC VIDEO</button>
        </div>

        <div class="mixer">
            <div class="shield">HARDWARE CONTROL ACTIVE</div>
            <div class="fader-v-container"><span class="label">VOL 1</span><input type="range" class="fader-v" id="volA" min="0" max="100" value="100" oninput="upVol('A',this.value)"></div>
            <div class="eq-stack">
                <span class="label">HI</span><input type="range" class="eq-knob" id="hi" min="-20" max="20" value="0" oninput="send({type:'high',value:this.value})">
                <span class="label">MID</span><input type="range" class="eq-knob" id="mi" min="-20" max="20" value="0" oninput="send({type:'mid',value:this.value})">
                <span class="label">LOW</span><input type="range" class="eq-knob" id="lo" min="-20" max="20" value="0" oninput="send({type:'low',value:this.value})">
                <span class="label" style="color:var(--neon)">V-KILL</span><input type="range" class="eq-knob" id="vk" min="0" max="100" value="0" oninput="send({type:'vocal',value:this.value})">
                <input type="range" class="xfader" id="xf" min="0" max="100" value="50" oninput="upXF(this.value)">
            </div>
            <div class="fader-v-container"><span class="label">VOL 2</span><input type="range" class="fader-v" id="volB" min="0" max="100" value="100" oninput="upVol('B',this.value)"></div>
        </div>

        <div class="deck">
            <div style="display:flex; justify-content:space-between"><div class="bpm-num" id="ui-bpmB">124.0</div><span class="label">DECK 2</span></div>
            <input type="text" id="urlB" placeholder="YouTube Link B">
            <button class="btn" style="background:var(--gold)" onclick="loadV('B')">LOAD B</button>
            <div style="display:flex; gap:5px"><button class="btn btn-play" onclick="cmd('B','play')">▶ PLAY</button><button class="btn btn-stop" onclick="cmd('B','stop')">■ STOP</button></div>
            <button class="btn" style="background:#222; color:var(--gold); font-size:9px" onclick="syncV('B')">SYNC VIDEO</button>
        </div>
    </div>
</div>

<div style="display:none;"><div id="pA"></div><div id="pB"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    const peer = new Peer();
    let conn, playerA, playerB, mode = 'hw';

    peer.on('open', () => {
        conn = peer.connect('bamboo-terrace-aropirmon-final');
        conn.on('open', () => document.getElementById('tvL').classList.add('active'));
    });

    function toggleM() {
        mode = (mode === 'hw') ? 'sw' : 'hw';
        document.getElementById('ui-container').className = (mode === 'hw') ? 'wrapper hw-locked' : 'wrapper';
        document.getElementById('mBtn').innerText = (mode === 'hw') ? 'MODE: PIONEER RX3' : 'MODE: SMART REMOTE';
        document.getElementById('mBtn').className = (mode === 'hw') ? 'mode-btn' : 'mode-btn sw';
    }

    if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess().then(access => {
            for (let input of access.inputs.values()) {
                document.getElementById('miL').classList.add('active');
                input.onmidimessage = (msg) => {
                    if(mode !== 'hw') return;
                    const [s, k, v] = msg.data;
                    if(k === 31) upXF((v/127)*100);
                    if(k === 19) upVol('A', (v/127)*100);
                    if(k === 23) upVol('B', (v/127)*100);
                    if(k === 11 && v === 127) cmd('A', 'play');
                    if(k === 12 && v === 127) cmd('B', 'play');
                    if(k === 7) send({type:'high', value:((v/127)*40)-20});
                    if(k === 8) send({type:'mid', value:((v/127)*40)-20});
                    if(k === 9) send({type:'low', value:((v/127)*40)-20});
                };
            }
        });
    }

    function onYouTubeIframeAPIReady() {
        playerA = new YT.Player('pA', { height:'0', width:'0', playerVars:{ controls:0 }});
        playerB = new YT.Player('pB', { height:'0', width:'0', playerVars:{ controls:0 }});
    }

    function upXF(v) { document.getElementById('xf').value = v; send({type:'xfade', value:v}); }
    function upVol(d, v) { if(d === 'A') playerA.setVolume(v); else playerB.setVolume(v); document.getElementById('vol'+d).value = v; }
    function syncV(d) { const p = (d === 'A')?playerA:playerB; if(p && p.getCurrentTime) send({type:'sync'+d, time:p.getCurrentTime()}); }
    
    function loadV(d) {
        const id = document.getElementById('url'+d).value.match(/(?:v=|\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
        if(id) {
            if(d === 'A') playerA.loadVideoById(id[1]); else playerB.loadVideoById(id[1]);
            send({type: 'load'+d, id: id[1]});
        }
    }

    function cmd(d, c) {
        if(d === 'A') c === 'play' ? playerA.playVideo() : playerA.stopVideo();
        if(d === 'B') c === 'play' ? playerB.playVideo() : playerB.stopVideo();
        send({type: 'cmd'+d, cmd: c});
    }

    // WAVEFORM ENGINE FIX
    setInterval(() => {
        if(playerA && playerA.getCurrentTime) {
            const posA = (playerA.getCurrentTime() * 80); // 80px per detik
            document.getElementById('gridA').style.transform = `translateX(-${posA % 4000}px)`;
            const posB = (playerB.getCurrentTime() * 80);
            document.getElementById('gridB').style.transform = `translateX(-${posB % 4000}px)`;
        }
    }, 50);

    function send(data) { if(conn && conn.open) conn.send(data); }
</script>
</body>
</html>
