<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bamboo DJ — Pro Command</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #ff003c; --gold: #c9a468; --bg: #050505; --card: #121513; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Jost', sans-serif; height: 100%; }

        .wrapper { display: flex; flex-direction: column; height: 100vh; padding: 8px; gap: 8px; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px; background: #111; border-radius: 10px; border: 1px solid #222;
        }
        .logo { font-family: 'Alex Brush'; font-size: 24px; color: #fff; text-shadow: 0 0 10px var(--neon); margin:0; }

        /* MODE SWITCHER */
        .mode-box { display: flex; gap: 5px; background: #000; padding: 4px; border-radius: 8px; border: 1px solid var(--gold); }
        .mode-btn { background: none; border: none; color: #888; padding: 6px 12px; font-size: 10px; font-weight: 700; cursor: pointer; border-radius: 5px; }
        .mode-btn.active { background: var(--gold); color: #000; }
        
        .led-group { display: flex; gap: 10px; font-size: 9px; align-items: center; }
        .led { width: 7px; height: 7px; border-radius: 50%; background: #333; display: inline-block; }
        .led.on { background: #4caf50; box-shadow: 0 0 10px #4caf50; }

        /* ENGINE LAYOUT */
        .main-engine { display: flex; gap: 8px; flex: 1; min-height: 0; }
        
        @media (max-width: 768px) {
            .main-engine { flex-direction: column; overflow-y: auto; }
            .mixer { width: 100% !important; height: auto !important; padding: 20px 0 !important; }
            .deck { min-height: 300px; }
        }

        .deck { flex: 1; background: var(--card); border-radius: 15px; border: 1px solid #222; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .bpm-num { font-size: 32px; font-weight: 700; color: var(--gold); }

        .mixer { width: 220px; background: #080808; border: 1px solid var(--neon); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; position: relative; }
        
        /* SHIELD UNTUK HARDWARE MODE */
        #mixer-shield { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 10; border-radius: 15px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; color: var(--gold); display: none; }
        .hw-active #mixer-shield { display: flex; }

        .fader-v { appearance: none; width: 120px; height: 4px; background: #222; transform: rotate(-90deg); margin: 50px 0; outline: none; accent-color: var(--gold); }
        .xfader { width: 80%; height: 40px; accent-color: var(--neon); }
        
        input[type=text] { width: 100%; background: #000; border: 1px solid #333; color: var(--gold); padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 5px; }
        .btn-load { width: 100%; background: var(--gold); border: none; padding: 10px; font-weight: 800; border-radius: 6px; cursor: pointer; }
        .btn-play { background: #1a3a26; border: 1px solid #4caf50; color: #4caf50; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="wrapper" id="main-ui">
    <header>
        <p class="logo">Bamboo Terrace</p>
        <div class="mode-box">
            <button id="btn-hw" class="mode-btn active" onclick="setMode('hw')">PIONEER RX3</button>
            <button id="btn-sw" class="mode-btn" onclick="setMode('sw')">SMART REMOTE</button>
        </div>
        <div class="led-group">
            <div>TV <div id="tvLed" class="led"></div></div>
            <div>MIDI <div id="midiLed" class="led"></div></div>
        </div>
    </header>

    <div class="main-engine">
        <!-- DECK 1 -->
        <div class="deck">
            <div style="display:flex; justify-content:space-between"><span style="font-size:10px; color:var(--gold)">DECK 1</span><div class="bpm-num">128.0</div></div>
            <div>
                <input type="text" id="urlA" placeholder="Link YouTube A">
                <button class="btn-load" onclick="loadV('A')">LOAD A</button>
            </div>
            <button class="btn-play" onclick="cmd('A','play')">PLAY DECK A</button>
        </div>

        <!-- MIXER -->
        <div class="mixer">
            <div id="mixer-shield">HARDWARE MODE<br>USE PIONEER RX3</div>
            <div style="text-align:center">
                <div style="font-size:8px; color:var(--gold)">HIGH</div>
                <input type="range" class="fader-v" min="-20" max="20" value="0" oninput="send({type:'high', value:this.value})">
            </div>
            <div style="text-align:center">
                <div style="font-size:8px; color:var(--gold)">LOW</div>
                <input type="range" class="fader-v" min="-20" max="20" value="0" oninput="send({type:'low', value:this.value})">
            </div>
            <div style="width:100%; text-align:center;">
                <div style="font-size:8px; color:var(--neon)">CROSSFADE VIDEO</div>
                <input type="range" class="xfader" id="xf" min="0" max="100" value="50" oninput="updateXF(this.value)">
            </div>
        </div>

        <!-- DECK 2 -->
        <div class="deck">
            <div style="display:flex; justify-content:space-between"><div class="bpm-num">124.0</div><span style="font-size:10px; color:var(--gold)">DECK 2</span></div>
            <div>
                <input type="text" id="urlB" placeholder="Link YouTube B">
                <button class="btn-load" onclick="loadV('B')">LOAD B</button>
            </div>
            <button class="btn-play" onclick="cmd('B','play')">PLAY DECK B</button>
        </div>
    </div>
</div>

<div style="display:none;"><div id="pA"></div><div id="pB"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    const peer = new Peer();
    let conn, playerA, playerB, mode = 'hw';

    // KONEKSI KE TV
    peer.on('open', () => {
        conn = peer.connect('bamboo-terrace-aropirmon-88');
        conn.on('open', () => { document.getElementById('tvLed').classList.add('on'); });
    });

    function setMode(m) {
        mode = m;
        document.getElementById('btn-hw').classList.toggle('active', m === 'hw');
        document.getElementById('btn-sw').classList.toggle('active', m === 'sw');
        document.getElementById('main-ui').classList.toggle('hw-active', m === 'hw');
    }

    // MIDI PIONEER RX3
    if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess().then(access => {
            for (let input of access.inputs.values()) {
                document.getElementById('midiLed').classList.add('on');
                input.onmidimessage = (msg) => {
                    if(mode !== 'hw') return;
                    const [s, k, v] = msg.data;
                    if(k === 31) updateXF((v/127)*100);
                    if(k === 11 && v === 127) cmd('A', 'play');
                    if(k === 12 && v === 127) cmd('B', 'play');
                };
            }
        });
    }

    function onYouTubeIframeAPIReady() {
        playerA = new YT.Player('pA', { height:'0', width:'0', playerVars:{ controls:0 }});
        playerB = new YT.Player('pB', { height:'0', width:'0', playerVars:{ controls:0 }});
    }

    function updateXF(v) { document.getElementById('xf').value = v; send({type:'xfade', value:v}); }
    
    function loadV(d) {
        const id = document.getElementById('url'+d).value.match(/(?:v=|\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
        if(id) {
            if(d === 'A') playerA.loadVideoById(id[1]); else playerB.loadVideoById(id[1]);
            send({type: 'load'+d, id: id[1]});
        }
    }

    function cmd(d, c) {
        if(d === 'A') c === 'play' ? playerA.playVideo() : playerA.pauseVideo();
        if(d === 'B') c === 'play' ? playerB.playVideo() : playerB.pauseVideo();
        send({type: 'cmd'+d, cmd: c});
    }

    function send(data) { if(conn && conn.open) conn.send(data); }

    // Jalankan Mode Hardware di awal
    setMode('hw');
</script>
</body>
</html>
