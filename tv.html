<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bamboo Terrace Cinema — 100" Pro Ultimate</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Jost:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #ff003c; --dark: #050505; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none !important; }
        #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        .deck-wrapper { position: absolute; top: 50%; left: 50%; width: 115vw; height: 115vh; transform: translate(-50%, -50%); transition: opacity 0.8s ease; pointer-events: none; opacity: 0; }
        iframe { width: 100%; height: 100%; border: none; }
        #interaction-shield { position: absolute; inset: 0; z-index: 50; background: transparent; cursor: none; }
        .branding { position: absolute; bottom: 40px; left: 40px; z-index: 100; text-align: center; pointer-events: none; }
        .logo-text { font-family: 'Alex Brush'; font-size: 38px; color: #fff; text-shadow: 0 0 15px var(--neon); margin: 0; }
        .bar-text { font-family: 'Jost'; font-size: 11px; letter-spacing: 10px; color: #fff; margin-top: 5px; opacity: 0.8; }
        #init-shield { position: fixed; inset: 0; background: var(--dark); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-init { background: var(--neon); color: white; border: none; padding: 20px 60px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 18px; box-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>
<div id="interaction-shield"></div>
<div id="init-shield">
    <p class="logo-text" style="font-size:80px">Bamboo Terrace</p>
    <p id="status-net" style="color:white; font-size:12px; margin: 20px 0; letter-spacing:2px;">MENGHUBUNGKAN KE SATELIT...</p>
    <button id="startBtn" class="btn-init" style="display:none;" onclick="startCinema()">AKTIFKAN MIXER & CINEMA</button>
</div>
<div id="stage">
    <div class="branding"><p class="logo-text">Bamboo Terrace</p><p class="bar-text">BAR</p></div>
    <div id="deckA" class="deck-wrapper"><div id="playerA"></div></div>
    <div id="deckB" class="deck-wrapper"><div id="playerB"></div></div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    const UNIQUE_ID = 'bamboo-terrace-pro-master-88';
    const peer = new Peer(UNIQUE_ID);
    let playerA, playerB, audioCtx, invR, invL, lowFilter, midFilter, highFilter;

    function onYouTubeIframeAPIReady() {
        const cfg = { height:'100%', width:'100%', playerVars:{ controls:0, disablekb:1, modestbranding:1, autoplay:1, mute:1, cc_load_policy:0, iv_load_policy:3, rel:0, showinfo:0 }};
        playerA = new YT.Player('playerA', cfg); playerB = new YT.Player('playerB', cfg);
    }

    peer.on('open', () => {
        document.getElementById('status-net').innerText = "JARINGAN AKTIF. SIAP TERHUBUNG.";
        document.getElementById('startBtn').style.display = 'block';
    });

    async function startCinema() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
            document.documentElement.requestFullscreen();
            document.getElementById('init-shield').style.display = 'none';
            document.getElementById('deckA').style.opacity = 1;

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);

            lowFilter = audioCtx.createBiquadFilter(); lowFilter.type = 'lowshelf'; lowFilter.frequency.value = 320;
            midFilter = audioCtx.createBiquadFilter(); midFilter.type = 'peaking'; midFilter.frequency.value = 1000;
            highFilter = audioCtx.createBiquadFilter(); highFilter.type = 'highshelf'; highFilter.frequency.value = 3200;

            const splitter = audioCtx.createChannelSplitter(2);
            const merger = audioCtx.createChannelMerger(2);
            invR = audioCtx.createGain(); invL = audioCtx.createGain();
            invR.gain.value = 0; invL.gain.value = 0;

            source.connect(lowFilter); lowFilter.connect(midFilter); midFilter.connect(highFilter); highFilter.connect(splitter);
            splitter.connect(merger, 0, 0); splitter.connect(invR, 1); invR.connect(merger, 0, 0);
            splitter.connect(merger, 1, 1); splitter.connect(invL, 0); invL.connect(merger, 0, 1);
            merger.connect(audioCtx.destination);
        } catch (e) { alert("Wajib 'Share Audio' agar Mixer bekerja!"); }
    }

    peer.on('connection', (conn) => {
        conn.on('data', (d) => {
            if(d.type === 'loadA') playerA.loadVideoById(d.id);
            if(d.type === 'loadB') playerB.loadVideoById(d.id);
            if(d.type === 'xfade') {
                document.getElementById('deckA').style.opacity = (100 - d.value) / 100;
                document.getElementById('deckB').style.opacity = d.value / 100;
            }
            if(d.type === 'cmdA') d.cmd === 'play' ? playerA.playVideo() : playerA.stopVideo();
            if(d.type === 'cmdB') d.cmd === 'play' ? playerB.playVideo() : playerB.stopVideo();
            if(d.type === 'rateA') playerA.setPlaybackRate(d.value);
            if(d.type === 'rateB') playerB.setPlaybackRate(d.value);
            if(d.type === 'syncA') playerA.seekTo(d.time, true);
            if(d.type === 'syncB') playerB.seekTo(d.time, true);
            if(d.type === 'low') if(lowFilter) lowFilter.gain.value = d.value;
            if(d.type === 'mid') if(midFilter) midFilter.gain.value = d.value;
            if(d.type === 'high') if(highFilter) highFilter.gain.value = d.value;
            if(d.type === 'vocal') if(invR) { invR.gain.value = -d.value/100; invL.gain.value = -d.value/100; }
        });
    });
</script>
</body>
</html>
