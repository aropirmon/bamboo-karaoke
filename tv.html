<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bamboo Terrace Bar — Cinema</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Jost:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #ff003c; --dark: #050505; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--dark); overflow: hidden; }
        #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        .deck-wrapper { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; transition: opacity 1.2s ease; pointer-events: none; }
        #deckA { z-index: 2; opacity: 1; }
        #deckB { z-index: 1; opacity: 0; }
        iframe { width: 100%; height: 100%; border: none; }
        .branding { position: absolute; bottom: 40px; left: 40px; z-index: 100; text-align: center; }
        .logo-text { font-family: 'Alex Brush'; font-size: 38px; color: #fff; text-shadow: 0 0 15px var(--neon); margin: 0; }
        .bar-text { font-family: 'Jost'; font-size: 11px; letter-spacing: 10px; color: #fff; margin-top: 5px; opacity: 0.8; }
        #setup { position: fixed; inset: 0; background: var(--dark); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-start { background: none; border: 1px solid var(--neon); color: #fff; padding: 15px 50px; font-family: 'Jost'; letter-spacing: 5px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
<div id="setup">
    <p class="logo-text" style="font-size:60px">Bamboo Terrace</p>
    <button class="btn-start" onclick="initSystem()">INITIALIZE SYSTEM</button>
</div>
<div id="stage">
    <div class="branding"><p class="logo-text">Bamboo Terrace</p><p class="bar-text">BAR</p></div>
    <div id="deckA" class="deck-wrapper"><div id="playerA"></div></div>
    <div id="deckB" class="deck-wrapper"><div id="playerB"></div></div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    const peer = new Peer('bamboo-terrace-aropirmon-88'); 
    let playerA, playerB;

    function onYouTubeIframeAPIReady() {
        const cfg = { height:'100%', width:'100%', playerVars:{ controls:0, disablekb:1, rel:0, modestbranding:1, autoplay:1, mute:1 }};
        playerA = new YT.Player('playerA', cfg); playerB = new YT.Player('playerB', cfg);
    }

    function initSystem() {
        document.documentElement.requestFullscreen();
        document.getElementById('setup').style.display = 'none';
    }

    peer.on('connection', (conn) => {
        conn.on('data', (d) => {
            if(d.type === 'loadA') playerA.loadVideoById(d.id);
            if(d.type === 'loadB') playerB.loadVideoById(d.id);
            if(d.type === 'xfade') {
                document.getElementById('deckA').style.opacity = (100 - d.value) / 100;
                document.getElementById('deckB').style.opacity = d.value / 100;
            }
            if(d.type === 'cmdA') d.cmd === 'play' ? playerA.playVideo() : playerA.pauseVideo();
            if(d.type === 'cmdB') d.cmd === 'play' ? playerB.playVideo() : playerB.pauseVideo();
        });
    });
</script>
</body>
</html>
